<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Drawing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="top-toolbar">
            <div class="tool-setting-horizontal setting-normal">
                <label for="brushSizeSlider">Brush</label>
                <input type="range" id="brushSizeSlider" min="1" max="100" value="3">
                <span id="brushSizeValue">3</span>
            </div>
            <div class="tool-setting-horizontal">
                <label for="brushColorPicker">Color</label>
                <input type="color" id="brushColorPicker" value="#ffffff" title="Brush Color">
                <div id="colorPalette" class="color-palette-container">
                    <button class="color-swatch active" data-color="#ffffff" style="background-color: #ffffff;" title="White"></button>
                    <button class="color-swatch" data-color="#ff0000" style="background-color: #ff0000;" title="Red"></button>
                    <button class="color-swatch" data-color="#ffa500" style="background-color: #ffa500;" title="Orange"></button>
                    <button class="color-swatch" data-color="#ffff00" style="background-color: #ffff00;" title="Yellow"></button>
                    <button class="color-swatch" data-color="#008000" style="background-color: #008000;" title="Green"></button>
                    <button class="color-swatch" data-color="#00ffff" style="background-color: #00ffff;" title="Cyan"></button>
                    <button class="color-swatch" data-color="#0000ff" style="background-color: #0000ff;" title="Blue"></button>
                    <button class="color-swatch" data-color="#800080" style="background-color: #800080;" title="Purple"></button>
                    <button class="color-swatch" data-color="#ffc0cb" style="background-color: #ffc0cb;" title="Pink"></button>
                    <button class="color-swatch" data-color="#000000" style="background-color: #000000;" title="Black"></button>
                </div>
                <!-- Hidden color input for swatch right-click palette -->
                <input type="color" id="swatchColorPicker" style="position: absolute; visibility: hidden; width: 0; height: 0;" title="">
            </div>
            <div class="tool-setting-horizontal setting-normal">
                <label for="eraserSizeSlider">Eraser</label>
                <input type="range" id="eraserSizeSlider" min="1" max="200" value="20">
                <span id="eraserSizeValue">20</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridEraserSizeSlider">G.Eraser</label>
                <input type="range" id="gridEraserSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridEraserSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridBrushSizeSlider">G.Brush</label>
                <input type="range" id="gridBrushSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridBrushSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <button id="upscaleBtn" title="Увеличить рисунок в 2 раза">2x</button>
            </div>
        </div>
        <button id="toggle-panels-btn" title="Toggle Panels">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/></svg>
        </button>
        <div id="main-menu" class="hidden">
            <div class="menu-item"><input type="checkbox" id="toggle-top-toolbar-cb" checked><label for="toggle-top-toolbar-cb">Top Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-left-toolbar-cb" checked><label for="toggle-left-toolbar-cb">Left Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-right-toolbar-cb" checked><label for="toggle-right-toolbar-cb">Right Toolbar</label></div>
        </div>
        <div id="symmetry-panel" class="hidden">
            <h4>Symmetry Mode</h4>
            <div class="symmetry-options">
                <button class="symmetry-mode-btn" data-mode="off">Off</button>
                <button class="symmetry-mode-btn" data-mode="vertical">Vertical</button>
                <button class="symmetry-mode-btn" data-mode="horizontal">Horizontal</button>
                <button class="symmetry-mode-btn" data-mode="quad">Quad</button>
                <button class="symmetry-mode-btn" data-mode="radial">Radial</button>
            </div>
            <div id="radial-ray-count-container" class="hidden">
                <label for="radial-ray-count">Rays:</label>
                <input type="number" id="radial-ray-count" min="2" max="36" value="8">
            </div>
        </div>
        <div id="left-toolbar" class="toolbar-vertical-buttons">
            <div class="tool-group">
                <button id="modeToggleBtn" class="mode-toggle-btn active" title="Mode: Grid (Q)">
                    <svg class="icon-grid" width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#9b81ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="8" height="8" rx="1.5" fill="url(#gridGrad1)" opacity="1"/>
                        <rect x="14" y="2" width="8" height="8" rx="1.5" fill="url(#gridGrad1)" opacity="0.85"/>
                        <rect x="2" y="14" width="8" height="8" rx="1.5" fill="url(#gridGrad1)" opacity="0.85"/>
                        <rect x="14" y="14" width="8" height="8" rx="1.5" fill="url(#gridGrad1)" opacity="0.7"/>
                        <circle cx="6" cy="6" r="1.2" fill="white" opacity="0.9"/>
                        <circle cx="18" cy="6" r="1.2" fill="white" opacity="0.7"/>
                        <circle cx="6" cy="18" r="1.2" fill="white" opacity="0.7"/>
                        <circle cx="18" cy="18" r="1.2" fill="white" opacity="0.5"/>
                    </svg>
                    <svg class="icon-pencil" width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.9" />
                            </linearGradient>
                        </defs>
                        <path d="M15.5 3L18.5 6L8 16.5L5 17L5.5 14L15.5 3Z" fill="url(#pencilGrad)" opacity="0.95"/>
                        <path d="M13.5 5L19 10.5" stroke="#FF8C00" stroke-width="1.8" stroke-linecap="round"/>
                        <rect x="4" y="17.5" width="16" height="2.5" rx="1.2" fill="#8B4513" opacity="0.8"/>
                        <circle cx="7" cy="15.5" r="1.3" fill="#222"/>
                        <path d="M5 14L8 11" stroke="#666" stroke-width="1" opacity="0.5"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group tools-main">
                <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.9" />
                            </linearGradient>
                        </defs>
                        <path d="M15.5 3L18.5 6L8 16.5L5 17L5.5 14L15.5 3Z" fill="url(#pencilBody)" opacity="0.95"/>
                        <path d="M13.5 5L19 10.5" stroke="#FF8C00" stroke-width="1.8" stroke-linecap="round"/>
                        <rect x="4" y="17.5" width="16" height="2.5" rx="1.2" fill="#8B4513" opacity="0.8"/>
                        <circle cx="7" cy="15.5" r="1.3" fill="#222"/>
                        <path d="M5 14L8 11" stroke="#666" stroke-width="1" opacity="0.5"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="select" title="Select (V)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="selectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M5 3L12 19L15 11L23 8L5 3Z" fill="url(#selectGrad)" opacity="0.85"/>
                        <path d="M5 3L12 19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M12 19L15 11" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M15 11L23 8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                        <circle cx="12" cy="19" r="1.8" fill="white" stroke="#1E90FF" stroke-width="1"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <rect x="4" y="4" width="16" height="12" rx="2" fill="url(#eraserGrad)" opacity="0.25" stroke="#FF69B4" stroke-width="1.8"/>
                        <line x1="8" y1="8" x2="16" y2="8" stroke="#FF69B4" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
                        <line x1="8" y1="11" x2="14" y2="11" stroke="#FF69B4" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
                        <rect x="6" y="18" width="12" height="2.5" rx="1.2" fill="#FF69B4" opacity="0.7"/>
                        <circle cx="9" cy="16" r="1" fill="#FF1493"/>
                        <circle cx="12" cy="16" r="1" fill="#FF1493"/>
                        <circle cx="15" cy="16" r="1" fill="#FF1493"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="pipette" title="Color Picker (I)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pipetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#808080;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M14 4L18 8L10 16H6V12L14 4Z" fill="url(#pipetteGrad)" opacity="0.35" stroke="#A0A0A0" stroke-width="1.8"/>
                        <circle cx="16" cy="6" r="2.5" fill="#FF4500" opacity="0.9"/>
                        <circle cx="16" cy="6" r="1.2" fill="white" opacity="0.6"/>
                        <line x1="14" y1="8" x2="10" y2="12" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round"/>
                        <rect x="4" y="17" width="3.5" height="4.5" rx="1.2" fill="#FF6347" opacity="0.7"/>
                        <rect x="8.5" y="17" width="3.5" height="4.5" rx="1.2" fill="#FFD700" opacity="0.7"/>
                        <rect x="13" y="17" width="3.5" height="4.5" rx="1.2" fill="#32CD32" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="fill" title="Fill (B)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00CED1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00868B;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M6 18L16 8L20 12L10 22H6V18Z" fill="url(#bucketGrad)" opacity="0.25" stroke="#00CED1" stroke-width="1.8"/>
                        <path d="M16 8L18 6L22 10L20 12" fill="#20B2AA" opacity="0.4" stroke="#00CED1" stroke-width="1.5"/>
                        <circle cx="17" cy="7" r="1.8" fill="#00FFFF"/>
                        <path d="M4 16C4 16 6 14 8 14C10 14 12 16 12 16" stroke="#00CED1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                        <path d="M6 20C6 20 7 19 8 19C9 19 10 20 10 20" stroke="#00CED1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                        <circle cx="7" cy="17" r="0.8" fill="#00FFFF" opacity="0.8"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="grid-draw" title="Grid Draw (G)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridDrawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#228B22;stop-opacity:0.7" />
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="1"/>
                        <rect x="9" y="2" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.75"/>
                        <rect x="16" y="2" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.45"/>
                        <rect x="2" y="9" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.75"/>
                        <rect x="9" y="9" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="1"/>
                        <rect x="16" y="9" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.75"/>
                        <rect x="2" y="16" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.45"/>
                        <rect x="9" y="16" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="0.75"/>
                        <rect x="16" y="16" width="6" height="6" rx="1.2" fill="url(#gridDrawGrad)" opacity="1"/>
                        <circle cx="5" cy="5" r="1" fill="white" opacity="0.9"/>
                        <circle cx="12" cy="12" r="1" fill="white" opacity="0.9"/>
                        <circle cx="19" cy="19" r="1" fill="white" opacity="0.9"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="rect-select" title="Rect Select (R)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="rectSelectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#FF8C00" stroke-width="2.2" stroke-dasharray="3,2"/>
                        <rect x="6" y="6" width="12" height="12" rx="1.5" fill="url(#rectSelectGrad)" opacity="0.25"/>
                        <circle cx="3" cy="3" r="2" fill="#FF8C00"/>
                        <circle cx="21" cy="3" r="2" fill="#FF8C00"/>
                        <circle cx="3" cy="21" r="2" fill="#FF8C00"/>
                        <circle cx="21" cy="21" r="2" fill="#FF8C00"/>
                        <circle cx="3" cy="3" r="1" fill="white" opacity="0.8"/>
                        <circle cx="21" cy="3" r="1" fill="white" opacity="0.8"/>
                        <circle cx="3" cy="21" r="1" fill="white" opacity="0.8"/>
                        <circle cx="21" cy="21" r="1" fill="white" opacity="0.8"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="lasso" title="Lasso (L)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="lassoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M12 4C8 4 5 7 5 11C5 15 8 18 12 18C16 18 19 15 19 11" fill="none" stroke="url(#lassoGrad)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3,2"/>
                        <circle cx="12" cy="4" r="2" fill="#FF69B4"/>
                        <circle cx="5" cy="11" r="2" fill="#FF69B4"/>
                        <circle cx="12" cy="18" r="2" fill="#FF69B4"/>
                        <circle cx="19" cy="11" r="2" fill="#FF69B4"/>
                        <circle cx="12" cy="4" r="1" fill="white" opacity="0.8"/>
                        <circle cx="5" cy="11" r="1" fill="white" opacity="0.8"/>
                        <circle cx="12" cy="18" r="1" fill="white" opacity="0.8"/>
                        <circle cx="19" cy="11" r="1" fill="white" opacity="0.8"/>
                        <path d="M9 10L11 12L13 10L15 12" fill="none" stroke="#FF69B4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="symmetryBtn" title="Symmetry (Y)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="symmetryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <line x1="12" y1="2" x2="12" y2="22" stroke="#9370DB" stroke-width="2.2" stroke-dasharray="3,2" opacity="0.7"/>
                        <path d="M6 6C6 6 8 12 6 18" fill="url(#symmetryGrad)" opacity="0.9"/>
                        <path d="M18 6C18 6 16 12 18 18" fill="url(#symmetryGrad)" opacity="0.9"/>
                        <circle cx="6" cy="6" r="2" fill="#9370DB"/>
                        <circle cx="18" cy="6" r="2" fill="#9370DB"/>
                        <circle cx="6" cy="18" r="2" fill="#9370DB"/>
                        <circle cx="18" cy="18" r="2" fill="#9370DB"/>
                        <circle cx="6" cy="6" r="1" fill="white" opacity="0.8"/>
                        <circle cx="18" cy="6" r="1" fill="white" opacity="0.8"/>
                        <circle cx="6" cy="18" r="1" fill="white" opacity="0.8"/>
                        <circle cx="18" cy="18" r="1" fill="white" opacity="0.8"/>
                        <circle cx="12" cy="12" r="2.5" fill="#9370DB" opacity="0.5"/>
                    </svg>
                </button>
                <button class="tool-btn" id="uploadBtn" title="Upload Image">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="uploadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3CB371;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M12 3L12 15" stroke="#3CB371" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M8 7L12 3L16 7" fill="none" stroke="#3CB371" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 15V20H20V15" fill="none" stroke="#3CB371" stroke-width="2.2" stroke-linecap="round"/>
                        <rect x="6" y="17" width="4.5" height="2.5" rx="1.2" fill="url(#uploadGrad)" opacity="0.6"/>
                        <circle cx="12" cy="10" r="1.5" fill="#3CB371" opacity="0.5"/>
                    </svg>
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
            </div>
        </div>
        <div id="right-toolbar">
            <div class="tool-group">
                <button class="tool-btn" id="fullscreenBtn" title="Fullscreen (F)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="fullscreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M3 3H9V5H5V9H3V3Z" fill="url(#fullscreenGrad)" opacity="0.9"/>
                        <path d="M15 3H21V9H19V5H15V3Z" fill="url(#fullscreenGrad)" opacity="0.9"/>
                        <path d="M3 15H5V19H9V21H3V15Z" fill="url(#fullscreenGrad)" opacity="0.9"/>
                        <path d="M19 15H21V21H15V19H19V15Z" fill="url(#fullscreenGrad)" opacity="0.9"/>
                        <rect x="8" y="8" width="8" height="8" rx="1.5" fill="url(#fullscreenGrad)" opacity="0.35"/>
                        <circle cx="12" cy="12" r="1" fill="white" opacity="0.6"/>
                    </svg>
                </button>
                <button class="tool-btn" id="zoomInBtn" title="Zoom In (+)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="zoomInGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <circle cx="10" cy="10" r="7.5" fill="none" stroke="url(#zoomInGrad)" stroke-width="2.2" opacity="0.7"/>
                        <line x1="10" y1="6.5" x2="10" y2="13.5" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="6.5" y1="10" x2="13.5" y2="10" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="15.5" y1="15.5" x2="21.5" y2="21.5" stroke="#FFA500" stroke-width="2.8" stroke-linecap="round"/>
                        <circle cx="10" cy="10" r="1.2" fill="#FFD700" opacity="0.6"/>
                    </svg>
                </button>
                <button class="tool-btn" id="zoomOutBtn" title="Zoom Out (-)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="zoomOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6347;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <circle cx="10" cy="10" r="7.5" fill="none" stroke="url(#zoomOutGrad)" stroke-width="2.2" opacity="0.7"/>
                        <line x1="6.5" y1="10" x2="13.5" y2="10" stroke="#FF6347" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="15.5" y1="15.5" x2="21.5" y2="21.5" stroke="#FF4500" stroke-width="2.8" stroke-linecap="round"/>
                        <circle cx="10" cy="10" r="1.2" fill="#FF6347" opacity="0.6"/>
                    </svg>
                </button>
                <button class="tool-btn" id="fitBtn" title="Fit">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="fitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#008B8B;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M3 7V5H9V7H5V11H3V7Z" fill="url(#fitGrad)" opacity="0.9"/>
                        <path d="M15 3H21V7H19V5H15V3Z" fill="url(#fitGrad)" opacity="0.9"/>
                        <path d="M19 15H21V21H15V19H17V15Z" fill="url(#fitGrad)" opacity="0.9"/>
                        <path d="M3 17H5V19H9V21H3V17Z" fill="url(#fitGrad)" opacity="0.9"/>
                        <rect x="8" y="8" width="8" height="8" rx="1.5" fill="url(#fitGrad)" opacity="0.3" stroke="#20B2AA" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="1.2" fill="white" opacity="0.7"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn active" id="gridBtn" title="Grid" data-active="true">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00FF7F;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00FA9A;stop-opacity:0.7" />
                            </linearGradient>
                        </defs>
                        <line x1="3" y1="3" x2="3" y2="21" stroke="url(#gridBtnGrad)" stroke-width="2.2" opacity="1"/>
                        <line x1="3" y1="3" x2="21" y2="3" stroke="url(#gridBtnGrad)" stroke-width="2.2" opacity="1"/>
                        <line x1="8" y1="3" x2="8" y2="21" stroke="url(#gridBtnGrad)" stroke-width="1.8" opacity="0.7"/>
                        <line x1="13" y1="3" x2="13" y2="21" stroke="url(#gridBtnGrad)" stroke-width="1.8" opacity="0.7"/>
                        <line x1="18" y1="3" x2="18" y2="21" stroke="url(#gridBtnGrad)" stroke-width="1.8" opacity="0.7"/>
                        <circle cx="3" cy="3" r="2" fill="#00FF7F"/>
                        <circle cx="3" cy="3" r="1" fill="white" opacity="0.8"/>
                    </svg>
                </button>
                <div class="tool-setting">
                    <label for="rightGridBrushSlider">G.B</label>
                    <input type="range" id="rightGridBrushSlider" min="1" max="15" step="1" value="1" title="Grid Brush Size">
                    <span id="rightGridBrushValue">1</span>
                </div>
                <input type="color" id="gridColorPicker" title="Grid Color" value="#006400">
                <div class="tool-setting">
                    <input type="number" id="gridSizeInput" min="10" max="200" step="10" value="50" title="Grid Size">
                </div>
                <input type="color" id="backgroundColorPicker" value="#2d2d2d" title="Background Color">
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="clearCanvasBtn" title="Clear">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="clearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF0000;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="12" r="9.5" fill="url(#clearGrad)" opacity="0.25" stroke="#FF4500" stroke-width="2"/>
                        <line x1="8" y1="8" x2="16" y2="16" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="16" y1="8" x2="8" y2="16" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="12" cy="12" r="2" fill="#FF4500" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="deleteBtn" title="Delete (Del)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="deleteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8B0000;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M4 6H20L18.5 20H5.5L4 6Z" fill="url(#deleteGrad)" opacity="0.25" stroke="#DC143C" stroke-width="1.8"/>
                        <line x1="2" y1="6" x2="22" y2="6" stroke="#DC143C" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M9 6V4H15V6" fill="none" stroke="#DC143C" stroke-width="1.8"/>
                        <line x1="9" y1="10" x2="9" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                        <line x1="12" y1="10" x2="12" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                        <line x1="15" y1="10" x2="15" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="saveBtn" title="Save">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="saveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#228B22;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M5 3H15V8H19V21H5V3Z" fill="url(#saveGrad)" opacity="0.25" stroke="#32CD32" stroke-width="1.8"/>
                        <rect x="7" y="5" width="6" height="2.5" rx="0.8" fill="#32CD32" opacity="0.7"/>
                        <rect x="8" y="12" width="8" height="6.5" rx="1.2" fill="url(#saveGrad)" opacity="0.4" stroke="#32CD32" stroke-width="1.8"/>
                        <circle cx="12" cy="15.5" r="1.8" fill="#32CD32" opacity="0.9"/>
                        <circle cx="12" cy="15.5" r="0.8" fill="white" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="loadBtn" title="Load">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2F4F4F;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M5 3H19V8L21 10V21H3V10L5 8V3Z" fill="url(#loadGrad)" opacity="0.25" stroke="#4682B4" stroke-width="1.8"/>
                        <path d="M10 12L12 14.5L14 12" fill="none" stroke="#4682B4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="14.5" x2="12" y2="8" stroke="#4682B4" stroke-width="2.5" stroke-linecap="round"/>
                        <rect x="7" y="5" width="4.5" height="2.5" rx="0.8" fill="#4682B4" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="exportBtn" title="Export">
                   <svg width="18" height="18" viewBox="0 0 24 24">
                       <defs>
                           <linearGradient id="exportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                               <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
                               <stop offset="100%" style="stop-color:#6A0DAD;stop-opacity:0.8" />
                           </linearGradient>
                       </defs>
                       <path d="M12 3L12 15" stroke="#9370DB" stroke-width="2.5" stroke-linecap="round"/>
                       <path d="M8 11L12 15L16 11" fill="none" stroke="#9370DB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                       <path d="M4 17V20H20V17" fill="none" stroke="#9370DB" stroke-width="2.2" stroke-linecap="round"/>
                       <rect x="6" y="6" width="3.5" height="2.5" rx="1" fill="url(#exportGrad)" opacity="0.6"/>
                       <circle cx="12" cy="10" r="1.5" fill="#9370DB" opacity="0.6"/>
                   </svg>
               </button>
            </div>
            <div id="zoomLevel">100%</div>
        </div>
        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="export-panel" class="hidden">
            <h4>Export As</h4>
            <div class="export-options">
                <button class="export-format-btn" data-format="png">PNG Image</button>
            </div>
        </div>
        <div id="statusBar">
            <span id="toolStatus">Tool: Select</span>
            <span id="colorStatus" class="color-indicator" title="Current Color"></span>
            <span id="posStatus">X: 0 Y: 0</span>
        </div>
        
        <!-- Timeline Playback Controls - separate from status bar -->
        <div class="timeline-controls" id="timelineControls">
            <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
                <svg width="12" height="12" viewBox="0 0 24 24">
                    <path d="M9 14L4 9L9 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 9H14C17.31 9 20 11.69 20 15C20 16.5 19.2 18.2 18 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="6" cy="9" r="1.5" fill="currentColor" opacity="0.8"/>
                </svg>
            </button>
            <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)">
                <svg width="12" height="12" viewBox="0 0 24 24">
                    <path d="M15 14L20 9L15 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 9H10C6.69 9 4 11.69 4 15C4 16.5 4.8 18.2 6 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="18" cy="9" r="1.5" fill="currentColor" opacity="0.8"/>
                </svg>
            </button>
            <button class="timeline-btn" id="timelinePlayBtn" title="Play/Pause">▶</button>
            <input type="range" id="timelineSlider" min="0" max="0" value="0" class="timeline-slider">
            <span id="timelineFrame">0/0</span>
            <button class="timeline-btn" id="timelineSpeedBtn" title="Speed: 1x">1x</button>
        </div>
    </div>
    <script type="module" src="js/main.js" defer></script>
</body>
</html>
