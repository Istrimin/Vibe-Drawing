<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Drawing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="top-toolbar">
            <div class="tool-setting-horizontal setting-normal">
                <label for="brushSizeSlider">Brush</label>
                <input type="range" id="brushSizeSlider" min="1" max="100" value="3">
                <span id="brushSizeValue">3</span>
            </div>
            <div class="tool-setting-horizontal">
                <label for="brushColorPicker">Color</label>
                <input type="color" id="brushColorPicker" value="#ffffff" title="Brush Color">
                <div id="colorPalette" class="color-palette-container">
                    <button class="color-swatch active" data-color="#ffffff" style="background-color: #ffffff;" title="White"></button>
                    <button class="color-swatch" data-color="#ff0000" style="background-color: #ff0000;" title="Red"></button>
                    <button class="color-swatch" data-color="#ffa500" style="background-color: #ffa500;" title="Orange"></button>
                    <button class="color-swatch" data-color="#ffff00" style="background-color: #ffff00;" title="Yellow"></button>
                    <button class="color-swatch" data-color="#008000" style="background-color: #008000;" title="Green"></button>
                    <button class="color-swatch" data-color="#00ffff" style="background-color: #00ffff;" title="Cyan"></button>
                    <button class="color-swatch" data-color="#0000ff" style="background-color: #0000ff;" title="Blue"></button>
                    <button class="color-swatch" data-color="#800080" style="background-color: #800080;" title="Purple"></button>
                    <button class="color-swatch" data-color="#ffc0cb" style="background-color: #ffc0cb;" title="Pink"></button>
                    <button class="color-swatch" data-color="#000000" style="background-color: #000000;" title="Black"></button>
                </div>
                <!-- Hidden color input for swatch right-click palette -->
                <input type="color" id="swatchColorPicker" style="position: absolute; visibility: hidden; width: 0; height: 0;" title="">
            </div>
            <div class="tool-setting-horizontal setting-normal">
                <label for="eraserSizeSlider">Eraser</label>
                <input type="range" id="eraserSizeSlider" min="1" max="200" value="20">
                <span id="eraserSizeValue">20</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridEraserSizeSlider">G.Eraser</label>
                <input type="range" id="gridEraserSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridEraserSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridBrushSizeSlider">G.Brush</label>
                <input type="range" id="gridBrushSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridBrushSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridUpscaleSelect">Scale</label>
                <select id="gridUpscaleSelect" title="Grid Scale">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                </select>
            </div>
        </div>
        <button id="toggle-panels-btn" title="Toggle Panels">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/></svg>
        </button>
        <div id="main-menu" class="hidden">
            <div class="menu-item"><input type="checkbox" id="toggle-top-toolbar-cb" checked><label for="toggle-top-toolbar-cb">Top Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-left-toolbar-cb" checked><label for="toggle-left-toolbar-cb">Left Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-right-toolbar-cb" checked><label for="toggle-right-toolbar-cb">Right Toolbar</label></div>
        </div>
        <div id="symmetry-panel" class="hidden">
            <h4>Symmetry Mode</h4>
            <div class="symmetry-options">
                <button class="symmetry-mode-btn" data-mode="off">Off</button>
                <button class="symmetry-mode-btn" data-mode="vertical">Vertical</button>
                <button class="symmetry-mode-btn" data-mode="horizontal">Horizontal</button>
                <button class="symmetry-mode-btn" data-mode="quad">Quad</button>
                <button class="symmetry-mode-btn" data-mode="radial">Radial</button>
            </div>
            <div id="radial-ray-count-container" class="hidden">
                <label for="radial-ray-count">Rays:</label>
                <input type="number" id="radial-ray-count" min="2" max="36" value="8">
            </div>
        </div>
        <div id="left-toolbar" class="toolbar-vertical-buttons">
            <div class="tool-group">
                <button id="modeToggleBtn" class="mode-toggle-btn active" title="Mode: Grid (Q)">
                    <svg class="icon-grid" width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h18v18H3V3zM5 5v4h4V5H5zM5 11v4h4v-4H5zM5 17v2h4v-2H5zM11 5v4h4V5h-4zM11 11v4h4v-4h-4zM11 17v2h4v-2h-4zM17 5v4h4V5h-4zM17 11v4h4v-4h-4zM17 17v2h4v-2h-4z"/></svg>
                    <svg class="icon-pencil" width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
            </div>
            <div class="tool-group tools-main">
                <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
                <button class="tool-btn" data-tool="select" title="Select (V)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M15.14 3c-.51 0-1.02.2-1.41.59L5.59 12l3.54 3.54 8.14-8.15c.78-.78.78-2.05 0-2.83l-1.06-1.06c-.39-.39-.9-.5-1.07-.5zm-6.72 10.06l-3.54-3.54 6.36-6.36 3.54 3.54-6.36 6.36z"/></svg>
                </button>
                <button class="tool-btn" data-tool="pipette" title="Color Picker (I)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M20.71 5.63l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12c.4-.4.4-1.03.01-1.42zM5.21 18.79l1.79-1.79 3.54 3.54-1.79 1.79-3.54-3.54z"/></svg>
                </button>
                <button class="tool-btn" data-tool="fill" title="Fill (B)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM10 16.17l-4.88-4.88 4.88-4.88 4.88 4.88-4.88 4.88z"/></svg>
                </button>
                <button class="tool-btn" data-tool="grid-draw" title="Grid Draw (G)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h18v18H3V3zM5 5v4h4V5H5zM5 11v4h4v-4H5zM5 17v2h4v-2H5zM11 5v4h4V5h-4zM11 11v4h4v-4h-4zM11 17v2h4v-2h-4zM17 5v4h4V5h-4zM17 11v4h4v-4h-4zM17 17v2h4v-2h-4z"/></svg>
                </button>
                <button class="tool-btn" data-tool="rect-select" title="Rect Select (R)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M3 5a2 2 0 012-2h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5z"/></svg>
                </button>
                <button class="tool-btn" data-tool="lasso" title="Lasso (L)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 3c-1 2-2 5-1 9 1 4 5 5 7 3 2-2 3-5 3-8-2-4-4-5-9-4z"/></svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="symmetryBtn" title="Symmetry (Y)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path fill="currentColor" d="M12 6v12M6 12h12"/></svg>
                </button>
                <button class="tool-btn" id="uploadBtn" title="Upload Image">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
            </div>
        </div>
        <div id="right-toolbar">
            <div class="tool-group">
                <button class="tool-btn" id="fullscreenBtn" title="Fullscreen (F)">
                    <svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
                <button class="tool-btn" id="zoomInBtn" title="Zoom In (+)">
                    <svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
                </button>
                <button class="tool-btn" id="zoomOutBtn" title="Zoom Out (-)">
                    <svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg>
                </button>
                <button class="tool-btn" id="fitBtn" title="Fit">
                    <svg width="14" height="14" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="gridBtn" title="Grid" data-active="true">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M3 3v18h18M8 3v18M13 3v18M18 3v18"/></svg>
                </button>
                <input type="color" id="gridColorPicker" title="Grid Color" value="#006400">
                <div class="tool-setting">
                    <input type="number" id="gridSizeInput" min="10" max="200" step="10" value="50" title="Grid Size">
                </div>
                <input type="color" id="backgroundColorPicker" value="#2d2d2d" title="Background Color">
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="clearCanvasBtn" title="Clear">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <button class="tool-btn" id="deleteBtn" title="Delete (Del)">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
                <button class="tool-btn" id="saveBtn" title="Save">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                </button>
                <button class="tool-btn" id="loadBtn" title="Load">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                </button>
                <button class="tool-btn" id="exportBtn" title="Export">
                   <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
               </button>
            </div>
            <div id="zoomLevel">100%</div>
        </div>
        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="export-panel" class="hidden">
            <h4>Export As</h4>
            <div class="export-options">
                <button class="export-format-btn" data-format="png">PNG Image</button>
            </div>
        </div>
        <div id="statusBar">
            <span id="toolStatus">Tool: Select</span>
            <span id="colorStatus" class="color-indicator" title="Current Color"></span>
            <span id="posStatus">X: 0 Y: 0</span>
        </div>
        
        <!-- Timeline Playback Controls - separate from status bar -->
        <div class="timeline-controls" id="timelineControls">
            <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)">
                <svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>
            <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)">
                <svg width="12" height="12" viewBox="0 0 24 24"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            </button>
            <button class="timeline-btn" id="timelinePlayBtn" title="Play/Pause">▶</button>
            <input type="range" id="timelineSlider" min="0" max="0" value="0" class="timeline-slider">
            <span id="timelineFrame">0/0</span>
            <button class="timeline-btn" id="timelineSpeedBtn" title="Speed: 1x">1x</button>
        </div>
    </div>
    <script type="module" src="js/main.js" defer></script>
</body>
</html>
