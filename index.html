<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Drawing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="top-toolbar">
            <div class="tool-setting-horizontal setting-normal">
                <label for="brushSizeSlider">Brush</label>
                <input type="range" id="brushSizeSlider" min="1" max="100" value="3">
                <span id="brushSizeValue">3</span>
            </div>
            <div class="tool-setting-horizontal">
                <label for="brushColorPicker">Color</label>
                <input type="color" id="brushColorPicker" value="#ffffff" data-tooltip="Brush Color">
                <div id="colorPalette" class="color-palette-container">
                    <button class="color-swatch active" data-color="#ffffff" style="background-color: #ffffff;" data-tooltip="White"></button>
                    <button class="color-swatch" data-color="#ff0000" style="background-color: #ff0000;" data-tooltip="Red"></button>
                    <button class="color-swatch" data-color="#ffa500" style="background-color: #ffa500;" data-tooltip="Orange"></button>
                    <button class="color-swatch" data-color="#ffff00" style="background-color: #ffff00;" data-tooltip="Yellow"></button>
                    <button class="color-swatch" data-color="#008000" style="background-color: #008000;" data-tooltip="Green"></button>
                    <button class="color-swatch" data-color="#00ffff" style="background-color: #00ffff;" data-tooltip="Cyan"></button>
                    <button class="color-swatch" data-color="#0000ff" style="background-color: #0000ff;" data-tooltip="Blue"></button>
                    <button class="color-swatch" data-color="#800080" style="background-color: #800080;" data-tooltip="Purple"></button>
                    <button class="color-swatch" data-color="#ffc0cb" style="background-color: #ffc0cb;" data-tooltip="Pink"></button>
                    <button class="color-swatch" data-color="#000000" style="background-color: #000000;" data-tooltip="Black"></button>
                </div>
                <!-- Hidden color input for swatch right-click palette -->
                <input type="color" id="swatchColorPicker" style="position: absolute; visibility: hidden; width: 0; height: 0;" data-tooltip="">
            </div>
            <div class="tool-setting-horizontal setting-normal">
                <label for="eraserSizeSlider">Eraser</label>
                <input type="range" id="eraserSizeSlider" min="1" max="200" value="20">
                <span id="eraserSizeValue">20</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridEraserSizeSlider">G.Eraser</label>
                <input type="range" id="gridEraserSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridEraserSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <label for="gridBrushSizeSlider">G.Brush</label>
                <input type="range" id="gridBrushSizeSlider" min="1" max="32" step="1" value="1">
                <span id="gridBrushSizeValue">1</span>
            </div>
            <div class="tool-setting-horizontal setting-grid">
                <button id="upscaleBtn" data-tooltip="Увеличить рисунок в 2 раза">2x</button>
            </div>
        </div>
        <button id="toggle-panels-btn" data-tooltip="Toggle Panels">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/></svg>
        </button>
        <div id="main-menu" class="hidden">
            <div class="menu-item"><input type="checkbox" id="toggle-top-toolbar-cb" checked><label for="toggle-top-toolbar-cb">Top Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-left-toolbar-cb" checked><label for="toggle-left-toolbar-cb">Left Toolbar</label></div>
            <div class="menu-item"><input type="checkbox" id="toggle-right-toolbar-cb" checked><label for="toggle-right-toolbar-cb">Right Toolbar</label></div>
        </div>
        <div id="symmetry-panel" class="hidden">
            <h4>Symmetry Mode</h4>
            <div class="symmetry-options">
                <button class="symmetry-mode-btn" data-mode="off">Off</button>
                <button class="symmetry-mode-btn" data-mode="vertical">Vertical</button>
                <button class="symmetry-mode-btn" data-mode="horizontal">Horizontal</button>
                <button class="symmetry-mode-btn" data-mode="quad">Quad</button>
                <button class="symmetry-mode-btn" data-mode="radial">Radial</button>
            </div>
            <div id="radial-ray-count-container" class="hidden">
                <label for="radial-ray-count">Rays:</label>
                <input type="number" id="radial-ray-count" min="2" max="36" value="8">
            </div>
        </div>
        <div id="left-toolbar" class="toolbar-vertical-buttons">
            <div class="tool-group">
                <button id="modeToggleBtn" class="mode-toggle-btn active" data-tooltip="Mode: Grid (Q)">
                    <svg class="icon-grid" width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#9b81ff;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Grid cells -->
                        <rect x="2" y="2" width="8.5" height="8.5" rx="1.5" fill="url(#gridGrad1)" opacity="1" stroke="#7B61FF" stroke-width="0.5"/>
                        <rect x="13.5" y="2" width="8.5" height="8.5" rx="1.5" fill="url(#gridGrad1)" opacity="0.85" stroke="#7B61FF" stroke-width="0.5"/>
                        <rect x="2" y="13.5" width="8.5" height="8.5" rx="1.5" fill="url(#gridGrad1)" opacity="0.85" stroke="#7B61FF" stroke-width="0.5"/>
                        <rect x="13.5" y="13.5" width="8.5" height="8.5" rx="1.5" fill="url(#gridGrad1)" opacity="0.7" stroke="#7B61FF" stroke-width="0.5"/>
                        <!-- Pixel dots -->
                        <circle cx="6" cy="6" r="1.5" fill="white" opacity="0.9"/>
                        <circle cx="18" cy="6" r="1.5" fill="white" opacity="0.7"/>
                        <circle cx="6" cy="18" r="1.5" fill="white" opacity="0.7"/>
                        <circle cx="18" cy="18" r="1.5" fill="white" opacity="0.5"/>
                        <!-- Shine -->
                        <rect x="3" y="3" width="2" height="2" rx="0.5" fill="white" opacity="0.3"/>
                    </svg>
                    <svg class="icon-pencil" width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pencilGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.9" />
                            </linearGradient>
                        </defs>
                        <!-- Pencil body -->
                        <path d="M16.5 2.5L20.5 6.5L8.5 18.5L4 19L4.5 14.5L16.5 2.5Z" fill="url(#pencilGrad2)" stroke="#CC8800" stroke-width="0.5"/>
                        <!-- Pencil tip -->
                        <path d="M4.5 14.5L6 17.5L8.5 18.5" fill="#E8C87A" stroke="#CC8800" stroke-width="0.5"/>
                        <!-- Lead -->
                        <path d="M4.5 14.5L5.5 16L7 16.5L6 17.5L4.5 14.5Z" fill="#333"/>
                        <!-- Eraser -->
                        <ellipse cx="18" cy="5" rx="2" ry="1.5" fill="#FF69B4" stroke="#CC5599" stroke-width="0.5" transform="rotate(-45 18 5)"/>
                        <!-- Highlight -->
                        <path d="M16 4L19 7" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group tools-main">
                <button class="tool-btn active" data-tool="pencil" data-tooltip="Pencil (P)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.9" />
                            </linearGradient>
                        </defs>
                        <!-- Pencil body -->
                        <path d="M16.5 2.5L20.5 6.5L8.5 18.5L4 19L4.5 14.5L16.5 2.5Z" fill="url(#pencilBody)" stroke="#CC8800" stroke-width="0.5"/>
                        <!-- Pencil tip -->
                        <path d="M4.5 14.5L6 17.5L8.5 18.5" fill="#E8C87A" stroke="#CC8800" stroke-width="0.5"/>
                        <!-- Pencil lead -->
                        <path d="M4.5 14.5L5.5 16L7 16.5L6 17.5L4.5 14.5Z" fill="#333"/>
                        <!-- Metal band -->
                        <rect x="5" y="13" width="5" height="2.5" rx="0.5" fill="#C0C0C0" stroke="#999" stroke-width="0.4" transform="rotate(-45 7.5 14.25)"/>
                        <!-- Eraser -->
                        <ellipse cx="18" cy="5" rx="2" ry="1.5" fill="#FF69B4" stroke="#CC5599" stroke-width="0.5" transform="rotate(-45 18 5)"/>
                        <!-- Highlight -->
                        <path d="M16 4L19 7" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="select" data-tooltip="Select (V)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="selectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Arrow cursor -->
                        <path d="M6 3L6 20L10 15L15 21L17.5 19L12.5 13L19 13L6 3Z" fill="url(#selectGrad)" stroke="#1060C0" stroke-width="0.5"/>
                        <!-- Highlight -->
                        <path d="M7.5 6L15 12" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
                        <!-- Selection square hint -->
                        <rect x="15" y="15" width="5" height="5" rx="0.5" fill="none" stroke="#00BFFF" stroke-width="1" stroke-dasharray="1,1" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eraser" data-tooltip="Eraser (E)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Eraser body - slanted rectangle -->
                        <path d="M5 10L14 3L20 9L11 18L5 18Z" fill="url(#eraserGrad)" stroke="#CC4499" stroke-width="0.5"/>
                        <!-- Eraser top highlight -->
                        <path d="M7 10L14 4L18 8" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
                        <!-- Eraser band -->
                        <path d="M8 14L13 18L11 18L6 14" fill="#FFB6D9" stroke="#CC4499" stroke-width="0.4"/>
                        <!-- Eraser particles/dust -->
                        <circle cx="15" cy="15" r="0.6" fill="#FF69B4" opacity="0.7"/>
                        <circle cx="17" cy="13" r="0.5" fill="#FF69B4" opacity="0.5"/>
                        <circle cx="16" cy="17" r="0.4" fill="#FF69B4" opacity="0.6"/>
                        <!-- Wipe lines showing erasing action -->
                        <line x1="3" y1="20" x2="8" y2="20" stroke="#FF69B4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
                        <line x1="4" y1="21.5" x2="7" y2="21.5" stroke="#FF69B4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="pipette" data-tooltip="Color Picker (I)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="pipetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#808080;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Pipette tube -->
                        <path d="M14 4L18 8L10 16H6V12L14 4Z" fill="url(#pipetteGrad)" stroke="#888" stroke-width="0.5"/>
                        <!-- Glass highlight -->
                        <path d="M14.5 5L17 7.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
                        <!-- Pipette bulb -->
                        <circle cx="18.5" cy="5.5" r="2.5" fill="#666" stroke="#555" stroke-width="0.5"/>
                        <circle cx="19" cy="5" r="1" fill="#888" opacity="0.5"/>
                        <!-- Color drops at bottom -->
                        <rect x="3" y="18" width="4" height="4" rx="0.5" fill="#FF4444" stroke="#CC3333" stroke-width="0.3"/>
                        <rect x="8" y="18" width="4" height="4" rx="0.5" fill="#44BB44" stroke="#339933" stroke-width="0.3"/>
                        <rect x="13" y="18" width="4" height="4" rx="0.5" fill="#4488FF" stroke="#3366CC" stroke-width="0.3"/>
                        <!-- Color shine on squares -->
                        <rect x="3.5" y="18.5" width="1.5" height="1.5" rx="0.3" fill="white" opacity="0.3"/>
                        <rect x="8.5" y="18.5" width="1.5" height="1.5" rx="0.3" fill="white" opacity="0.3"/>
                        <rect x="13.5" y="18.5" width="1.5" height="1.5" rx="0.3" fill="white" opacity="0.3"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="fill" data-tooltip="Fill (B)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00CED1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00868B;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Bucket body -->
                        <path d="M7 5L17 5L15 18L9 18Z" fill="url(#bucketGrad)" stroke="#008B8B" stroke-width="0.5"/>
                        <!-- Bucket handle -->
                        <path d="M7 8C7 8 5 10 5 13C5 16 7 18 7 18" fill="none" stroke="#00CED1" stroke-width="1.8" stroke-linecap="round"/>
                        <!-- Bucket rim -->
                        <rect x="6" y="4" width="12" height="2" rx="1" fill="#00CED1" stroke="#008B8B" stroke-width="0.4"/>
                        <!-- Paint spilling out -->
                        <path d="M15 7L19 11L18 15L14 12Z" fill="#00FFFF" opacity="0.8"/>
                        <!-- Paint drops -->
                        <circle cx="19" cy="17" r="1" fill="#00FFFF" opacity="0.7"/>
                        <circle cx="17" cy="19" r="0.7" fill="#00FFFF" opacity="0.5"/>
                        <!-- Shine on bucket -->
                        <path d="M9 7L10 16" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="grid-draw" data-tooltip="Grid Draw (G)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridDrawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#228B22;stop-opacity:0.7" />
                            </linearGradient>
                        </defs>
                        <!-- Grid background -->
                        <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="#32CD32" stroke-width="1" opacity="0.3"/>
                        <!-- Grid lines -->
                        <line x1="8" y1="2" x2="8" y2="22" stroke="#32CD32" stroke-width="0.8" opacity="0.4"/>
                        <line x1="14" y1="2" x2="14" y2="22" stroke="#32CD32" stroke-width="0.8" opacity="0.4"/>
                        <line x1="2" y1="8" x2="22" y2="8" stroke="#32CD32" stroke-width="0.8" opacity="0.4"/>
                        <line x1="2" y1="14" x2="22" y2="14" stroke="#32CD32" stroke-width="0.8" opacity="0.4"/>
                        <!-- Filled cell highlight -->
                        <rect x="9" y="9" width="4" height="4" rx="0.5" fill="url(#gridDrawGrad)" opacity="0.9"/>
                        <rect x="9" y="9" width="4" height="4" rx="0.5" fill="none" stroke="#32CD32" stroke-width="0.8"/>
                        <!-- Pencil tip drawing on grid -->
                        <path d="M16 14L19 11L21 13L18 16Z" fill="#FFD700" stroke="#CC8800" stroke-width="0.4"/>
                        <path d="M16 14L16.5 15L17.5 15.5L17 14.5Z" fill="#333"/>
                        <!-- Dot markers at intersections -->
                        <circle cx="8" cy="8" r="1" fill="#32CD32" opacity="0.8"/>
                        <circle cx="14" cy="14" r="1" fill="#32CD32" opacity="0.8"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="rect-select" data-tooltip="Rect Select (R)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="rectSelectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Selection rectangle with dashed border -->
                        <rect x="4" y="4" width="16" height="16" rx="1" fill="url(#rectSelectGrad)" opacity="0.2" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="2,1.5"/>
                        <!-- Corner handles -->
                        <rect x="2.5" y="2.5" width="3" height="3" rx="0.5" fill="#FF8C00" stroke="white" stroke-width="0.5"/>
                        <rect x="18.5" y="2.5" width="3" height="3" rx="0.5" fill="#FF8C00" stroke="white" stroke-width="0.5"/>
                        <rect x="2.5" y="18.5" width="3" height="3" rx="0.5" fill="#FF8C00" stroke="white" stroke-width="0.5"/>
                        <rect x="18.5" y="18.5" width="3" height="3" rx="0.5" fill="#FF8C00" stroke="white" stroke-width="0.5"/>
                        <!-- Edge handles -->
                        <rect x="10" y="2.5" width="4" height="2.5" rx="0.5" fill="#FF8C00" opacity="0.8"/>
                        <rect x="10" y="19" width="4" height="2.5" rx="0.5" fill="#FF8C00" opacity="0.8"/>
                        <rect x="2.5" y="10" width="2.5" height="4" rx="0.5" fill="#FF8C00" opacity="0.8"/>
                        <rect x="19" y="10" width="2.5" height="4" rx="0.5" fill="#FF8C00" opacity="0.8"/>
                        <!-- Inner shine -->
                        <rect x="6" y="6" width="12" height="12" rx="0.5" fill="none" stroke="white" stroke-width="0.5" opacity="0.2"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="lasso" data-tooltip="Lasso (L)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="lassoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Lasso rope - freeform shape -->
                        <path d="M12 4C9 4 5 7 5 12C5 17 9 20 12 20C16 20 20 17 20 12C20 8 17 5 14 4" fill="none" stroke="url(#lassoGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.5,2"/>
                        <!-- Lasso end point -->
                        <circle cx="14" cy="4" r="2" fill="#FF69B4" stroke="white" stroke-width="0.5"/>
                        <!-- Selection dots inside -->
                        <circle cx="10" cy="10" r="1.2" fill="#FF69B4" opacity="0.7"/>
                        <circle cx="14" cy="12" r="1" fill="#FF69B4" opacity="0.6"/>
                        <circle cx="11" cy="15" r="0.8" fill="#FF69B4" opacity="0.5"/>
                        <!-- Rope tension highlight -->
                        <path d="M8 8C10 9 13 8 16 10" fill="none" stroke="white" stroke-width="0.8" stroke-linecap="round" opacity="0.3"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="symmetryBtn" data-tooltip="Symmetry (Y)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="symmetryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Mirror line -->
                        <line x1="12" y1="1" x2="12" y2="23" stroke="#9370DB" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
                        <!-- Left butterfly wing -->
                        <path d="M10 5C7 3 3 6 4 10C5 14 9 13 11 11" fill="url(#symmetryGrad)" opacity="0.8" stroke="#7B52B8" stroke-width="0.5"/>
                        <path d="M10 13C8 15 5 19 7 21C9 23 12 19 11 17" fill="url(#symmetryGrad)" opacity="0.7" stroke="#7B52B8" stroke-width="0.5"/>
                        <!-- Right butterfly wing (mirror) -->
                        <path d="M14 5C17 3 21 6 20 10C19 14 15 13 13 11" fill="url(#symmetryGrad)" opacity="0.8" stroke="#7B52B8" stroke-width="0.5"/>
                        <path d="M14 13C16 15 19 19 17 21C15 23 12 19 13 17" fill="url(#symmetryGrad)" opacity="0.7" stroke="#7B52B8" stroke-width="0.5"/>
                        <!-- Wing pattern dots -->
                        <circle cx="7" cy="8" r="1" fill="white" opacity="0.5"/>
                        <circle cx="17" cy="8" r="1" fill="white" opacity="0.5"/>
                        <circle cx="8" cy="16" r="0.8" fill="white" opacity="0.4"/>
                        <circle cx="16" cy="16" r="0.8" fill="white" opacity="0.4"/>
                    </svg>
                </button>
                <button class="tool-btn" id="uploadBtn" data-tooltip="Upload Image">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="uploadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3CB371;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Folder -->
                        <path d="M3 6L3 20H21V6H3Z" fill="url(#uploadGrad)" opacity="0.3" stroke="#3CB371" stroke-width="1.2"/>
                        <path d="M3 6L3 5C3 4 4 3 5 3H10L12 5H19C20 5 21 6 21 7V8" fill="none" stroke="#3CB371" stroke-width="1.2"/>
                        <!-- Upload arrow -->
                        <path d="M12 10V17" stroke="#3CB371" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M8 14L12 10L16 14" fill="none" stroke="#3CB371" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Image icon hint -->
                        <rect x="7" y="12" width="4" height="3" rx="0.5" fill="#3CB371" opacity="0.4"/>
                        <circle cx="8.5" cy="13" r="0.5" fill="white" opacity="0.5"/>
                    </svg>
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
            </div>
        </div>
        <div id="right-toolbar">
            <div class="tool-group">
                <button class="tool-btn" id="fullscreenBtn" data-tooltip="Fullscreen (F)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="fullscreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Expand arrows pointing outward -->
                        <path d="M3 7V3H7" fill="none" stroke="url(#fullscreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 3H21V7" fill="none" stroke="url(#fullscreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 17V21H17" fill="none" stroke="url(#fullscreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 21H3V17" fill="none" stroke="url(#fullscreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Screen rectangle -->
                        <rect x="6" y="6" width="12" height="12" rx="1.5" fill="url(#fullscreenGrad)" opacity="0.2" stroke="#4169E1" stroke-width="1.2"/>
                        <!-- Shine -->
                        <path d="M8 8L16 16" stroke="white" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="tool-btn" id="devToolsBtn" data-tooltip="Dev Tools">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="devToolsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Terminal window -->
                        <rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="url(#devToolsGrad)" stroke-width="1.5"/>
                        <!-- Title bar -->
                        <line x1="2" y1="7" x2="22" y2="7" stroke="url(#devToolsGrad)" stroke-width="1.5"/>
                        <!-- Window dots -->
                        <circle cx="5" cy="5" r="1" fill="#FF6B6B"/>
                        <circle cx="8" cy="5" r="1" fill="#FFD700"/>
                        <circle cx="11" cy="5" r="1" fill="#32CD32"/>
                        <!-- Code brackets -->
                        <path d="M7 11L5 14L7 17" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 11L19 14L17 17" fill="none" stroke="#FF6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="11" y1="18" x2="13" y2="10" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="tool-btn" id="autoSaveBtn" data-tooltip="Auto Save">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="autoSaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#45a049;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Disk body -->
                        <rect x="4" y="3" width="16" height="18" rx="2" fill="url(#autoSaveGrad)" opacity="0.3" stroke="#4CAF50" stroke-width="1.3"/>
                        <!-- Metal slider -->
                        <rect x="7" y="3" width="10" height="6" rx="1" fill="#888" stroke="#666" stroke-width="0.5"/>
                        <rect x="9" y="4" width="6" height="3" rx="0.5" fill="#AAA"/>
                        <!-- Label area -->
                        <rect x="7" y="13" width="10" height="6" rx="0.5" fill="#4CAF50" opacity="0.3"/>
                        <!-- Checkmark -->
                        <path d="M9 16L11 18L15 13" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="tool-btn" id="zoomInBtn" data-tooltip="Zoom In (+)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="zoomInGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Magnifying glass -->
                        <circle cx="10" cy="10" r="6.5" fill="none" stroke="url(#zoomInGrad)" stroke-width="2" opacity="0.8"/>
                        <!-- Plus inside lens -->
                        <line x1="7" y1="10" x2="13" y2="10" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="10" y1="7" x2="10" y2="13" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
                        <!-- Handle -->
                        <line x1="14.5" y1="14.5" x2="21" y2="21" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
                        <!-- Lens shine -->
                        <path d="M7 7C8 8 9 8.5 10 8.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none"/>
                    </svg>
                </button>
                <button class="tool-btn" id="zoomOutBtn" data-tooltip="Zoom Out (-)">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="zoomOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF6347;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Magnifying glass -->
                        <circle cx="10" cy="10" r="6.5" fill="none" stroke="url(#zoomOutGrad)" stroke-width="2" opacity="0.8"/>
                        <!-- Minus inside lens -->
                        <line x1="7" y1="10" x2="13" y2="10" stroke="#FF6347" stroke-width="2.5" stroke-linecap="round"/>
                        <!-- Handle -->
                        <line x1="14.5" y1="14.5" x2="21" y2="21" stroke="#FF4500" stroke-width="3" stroke-linecap="round"/>
                        <!-- Lens shine -->
                        <path d="M7 7C8 8 9 8.5 10 8.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4" fill="none"/>
                    </svg>
                </button>
                <button class="tool-btn" id="fitBtn" data-tooltip="Fit to Screen">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="fitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#008B8B;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <!-- Corner arrows pointing inward -->
                        <path d="M3 7V3H7" fill="none" stroke="url(#fitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 3H21V7" fill="none" stroke="url(#fitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 17V21H17" fill="none" stroke="url(#fitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 21H3V17" fill="none" stroke="url(#fitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Center rectangle (picture) -->
                        <rect x="7" y="7" width="10" height="10" rx="1" fill="url(#fitGrad)" opacity="0.25" stroke="#20B2AA" stroke-width="1.2"/>
                        <!-- Mountain/landscape icon inside -->
                        <path d="M8 15L10.5 11L12 13L14 10L16 15" fill="none" stroke="#20B2AA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                        <circle cx="14.5" cy="9" r="1" fill="#20B2AA" opacity="0.5"/>
                    </svg>
                </button>
            </div>
            <div class="tool-group">
                <button class="tool-btn active" id="gridBtn" data-tooltip="Toggle Grid" data-active="true">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="gridBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00FF7F;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00FA9A;stop-opacity:0.7" />
                            </linearGradient>
                        </defs>
                        <!-- Grid lines horizontal -->
                        <line x1="2" y1="6" x2="22" y2="6" stroke="url(#gridBtnGrad)" stroke-width="1.2" opacity="0.6"/>
                        <line x1="2" y1="12" x2="22" y2="12" stroke="url(#gridBtnGrad)" stroke-width="1.5" opacity="0.8"/>
                        <line x1="2" y1="18" x2="22" y2="18" stroke="url(#gridBtnGrad)" stroke-width="1.2" opacity="0.6"/>
                        <!-- Grid lines vertical -->
                        <line x1="6" y1="2" x2="6" y2="22" stroke="url(#gridBtnGrad)" stroke-width="1.2" opacity="0.6"/>
                        <line x1="12" y1="2" x2="12" y2="22" stroke="url(#gridBtnGrad)" stroke-width="1.5" opacity="0.8"/>
                        <line x1="18" y1="2" x2="18" y2="22" stroke="url(#gridBtnGrad)" stroke-width="1.2" opacity="0.6"/>
                        <!-- Intersection dots -->
                        <circle cx="12" cy="12" r="1.5" fill="#00FF7F"/>
                        <circle cx="12" cy="12" r="0.8" fill="white" opacity="0.6"/>
                        <circle cx="6" cy="6" r="1" fill="#00FF7F" opacity="0.5"/>
                        <circle cx="18" cy="6" r="1" fill="#00FF7F" opacity="0.5"/>
                        <circle cx="6" cy="18" r="1" fill="#00FF7F" opacity="0.5"/>
                        <circle cx="18" cy="18" r="1" fill="#00FF7F" opacity="0.5"/>
                        <!-- Border -->
                        <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="#00FF7F" stroke-width="1" opacity="0.4"/>
                    </svg>
                </button>
                <div class="tool-setting">
                    <label for="rightGridBrushSlider">G.B</label>
                    <input type="range" id="rightGridBrushSlider" min="1" max="15" step="1" value="1" data-tooltip="Grid Brush Size">
                    <span id="rightGridBrushValue">1</span>
                </div>
                <input type="color" id="gridColorPicker" data-tooltip="Grid Color" value="#006400">
                <div class="tool-setting">
                    <input type="number" id="gridSizeInput" min="10" max="200" step="10" value="50" data-tooltip="Grid Size">
                </div>
                <input type="color" id="backgroundColorPicker" value="#2d2d2d" data-tooltip="Background Color">
            </div>
            <div class="tool-group">
                <button class="tool-btn" id="clearCanvasBtn" data-tooltip="Clear">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="clearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF0000;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="12" r="9.5" fill="url(#clearGrad)" opacity="0.25" stroke="#FF4500" stroke-width="2"/>
                        <line x1="8" y1="8" x2="16" y2="16" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="16" y1="8" x2="8" y2="16" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="12" cy="12" r="2" fill="#FF4500" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="deleteBtn" data-tooltip="Delete (Del)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="deleteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#DC143C;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8B0000;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M4 6H20L18.5 20H5.5L4 6Z" fill="url(#deleteGrad)" opacity="0.25" stroke="#DC143C" stroke-width="1.8"/>
                        <line x1="2" y1="6" x2="22" y2="6" stroke="#DC143C" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M9 6V4H15V6" fill="none" stroke="#DC143C" stroke-width="1.8"/>
                        <line x1="9" y1="10" x2="9" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                        <line x1="12" y1="10" x2="12" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                        <line x1="15" y1="10" x2="15" y2="17" stroke="#DC143C" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="saveBtn" data-tooltip="Save">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="saveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#228B22;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M5 3H15V8H19V21H5V3Z" fill="url(#saveGrad)" opacity="0.25" stroke="#32CD32" stroke-width="1.8"/>
                        <rect x="7" y="5" width="6" height="2.5" rx="0.8" fill="#32CD32" opacity="0.7"/>
                        <rect x="8" y="12" width="8" height="6.5" rx="1.2" fill="url(#saveGrad)" opacity="0.4" stroke="#32CD32" stroke-width="1.8"/>
                        <circle cx="12" cy="15.5" r="1.8" fill="#32CD32" opacity="0.9"/>
                        <circle cx="12" cy="15.5" r="0.8" fill="white" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="loadBtn" data-tooltip="Load">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="loadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4682B4;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#2F4F4F;stop-opacity:0.8" />
                            </linearGradient>
                        </defs>
                        <path d="M5 3H19V8L21 10V21H3V10L5 8V3Z" fill="url(#loadGrad)" opacity="0.25" stroke="#4682B4" stroke-width="1.8"/>
                        <path d="M10 12L12 14.5L14 12" fill="none" stroke="#4682B4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="12" y1="14.5" x2="12" y2="8" stroke="#4682B4" stroke-width="2.5" stroke-linecap="round"/>
                        <rect x="7" y="5" width="4.5" height="2.5" rx="0.8" fill="#4682B4" opacity="0.7"/>
                    </svg>
                </button>
                <button class="tool-btn" id="exportBtn" data-tooltip="Export">
                   <svg width="18" height="18" viewBox="0 0 24 24">
                       <defs>
                           <linearGradient id="exportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                               <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
                               <stop offset="100%" style="stop-color:#6A0DAD;stop-opacity:0.8" />
                           </linearGradient>
                       </defs>
                       <path d="M12 3L12 15" stroke="#9370DB" stroke-width="2.5" stroke-linecap="round"/>
                       <path d="M8 11L12 15L16 11" fill="none" stroke="#9370DB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                       <path d="M4 17V20H20V17" fill="none" stroke="#9370DB" stroke-width="2.2" stroke-linecap="round"/>
                       <rect x="6" y="6" width="3.5" height="2.5" rx="1" fill="url(#exportGrad)" opacity="0.6"/>
                       <circle cx="12" cy="10" r="1.5" fill="#9370DB" opacity="0.6"/>
                   </svg>
               </button>
            </div>
            <div id="zoomLevel">100%</div>
        </div>
        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="export-panel" class="hidden">
            <h4>Export As</h4>
            <div class="export-options">
                <button class="export-format-btn" data-format="png">PNG Image</button>
            </div>
        </div>
        <div id="statusBar">
            <span id="toolStatus">Tool: Select</span>
            <span id="colorStatus" class="color-indicator" data-tooltip="Current Color"></span>
            <span id="posStatus">X: 0 Y: 0</span>
        </div>
        
        <!-- Timeline Playback Controls - separate from status bar -->
        <div class="timeline-controls" id="timelineControls">
            <button class="tool-btn" id="undoBtn" data-tooltip="Undo (Ctrl+Z)">
                <svg width="12" height="12" viewBox="0 0 24 24">
                    <path d="M9 14L4 9L9 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 9H14C17.31 9 20 11.69 20 15C20 16.5 19.2 18.2 18 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="6" cy="9" r="1.5" fill="currentColor" opacity="0.8"/>
                </svg>
            </button>
            <button class="tool-btn" id="redoBtn" data-tooltip="Redo (Ctrl+Y)">
                <svg width="12" height="12" viewBox="0 0 24 24">
                    <path d="M15 14L20 9L15 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 9H10C6.69 9 4 11.69 4 15C4 16.5 4.8 18.2 6 19.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    <circle cx="18" cy="9" r="1.5" fill="currentColor" opacity="0.8"/>
                </svg>
            </button>
            <button class="tool-btn" id="tasksBtn" data-tooltip="Tasks">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="7" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="7" y1="16" x2="14" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button class="timeline-btn" id="timelinePlayBtn" data-tooltip="Play/Pause">
                <svg width="14" height="14" viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7b61ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#5b41ef;stop-opacity:0.9" />
                        </linearGradient>
                    </defs>
                    <!-- Play triangle -->
                    <path d="M8 5L19 12L8 19Z" fill="url(#playGrad)" stroke="white" stroke-width="0.8" stroke-linejoin="round" class="play-icon"/>
                    <!-- Pause bars (hidden by default) -->
                    <rect x="7" y="6" width="3.5" height="12" rx="1" fill="url(#playGrad)" stroke="white" stroke-width="0.5" class="pause-icon" style="display:none"/>
                    <rect x="13.5" y="6" width="3.5" height="12" rx="1" fill="url(#playGrad)" stroke="white" stroke-width="0.5" class="pause-icon" style="display:none"/>
                </svg>
            </button>
            <input type="range" id="timelineSlider" min="0" max="0" value="0" class="timeline-slider">
            <span id="timelineFrame">0/0</span>
            <button class="timeline-btn" id="timelineSpeedBtn" data-tooltip="Playback Speed">
                <svg width="14" height="14" viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.9" />
                        </linearGradient>
                    </defs>
                    <!-- Speedometer/gauge -->
                    <path d="M12 4C7 4 3 8 3 13H6C6 9.7 8.7 7 12 7C15.3 7 18 9.7 18 13H21C21 8 17 4 12 4Z" fill="url(#speedGrad)" opacity="0.3" stroke="url(#speedGrad)" stroke-width="1.5"/>
                    <!-- Needle -->
                    <line x1="12" y1="13" x2="16" y2="7" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="13" r="2" fill="#FFD700" stroke="white" stroke-width="0.5"/>
                    <!-- Speed lines -->
                    <line x1="17" y1="5" x2="19" y2="3" stroke="#FFA500" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <line x1="20" y1="8" x2="22" y2="8" stroke="#FFA500" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="tasksDialog" class="dialog-overlay hidden">
            <div class="dialog-content tasks-dialog-content">
                <h3>📋 Tasks</h3>
                <textarea id="tasksTextarea" placeholder="Loading..." spellcheck="false"></textarea>
                <div class="dialog-buttons">
                    <button id="tasksLoadBtn" class="dialog-btn secondary">📂 Load</button>
                    <button id="tasksSaveBtn" class="dialog-btn primary">💾 Save</button>
                    <button id="tasksCloseBtn" class="dialog-btn">Close</button>
                </div>
                <input type="file" id="tasksFileInput" accept=".txt,.md" style="display:none">
            </div>
        </div>
    <div id="autoSaveDialog" class="dialog-overlay hidden">
            <div class="dialog-content">
                <h3>⏱️ Auto Save</h3>
                <div class="dialog-option">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoSaveCheckbox">
                        Enable auto-save every minute
                    </label>
                    <p class="dialog-description">Automatically saves your project every 60 seconds</p>
                </div>
                <div class="dialog-buttons">
                    <button id="autoSaveDialogClose" class="dialog-btn">Close</button>
                </div>
            </div>
        </div>
    <script type="module" src="js/main.js" defer></script>
</body>
</html>
